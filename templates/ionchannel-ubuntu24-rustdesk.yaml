name: ionchannel-ubuntu24-rustdesk
version: 1.0.0
description: |
  Ubuntu 24.04 LTS with RustDesk for ionChannel validation
  Complete substrate: Desktop + RustDesk ready for external access
  Fully automated, repeatable, exportable
  
base_image: /home/flockgate/Developemt/syntheticChemistry/agentReagents/images/cloud/ubuntu-24.04-server-cloudimg-amd64.img

resources:
  memory_mb: 4096
  vcpus: 2
  disk_gb: 30
  timeout_secs: 3600

users:
  - name: iontest
    password: iontest123
    groups:
      - sudo
      - users
    ssh_authorized_keys: []  # Will be added from environment

build_steps:
  - type: wait_cloud_init
    timeout_secs: 600
  
  # Install desktop environment
  - type: install_packages
    packages:
      - ubuntu-desktop-minimal
      - gdm3
      - gnome-terminal
      - gnome-shell-extensions
      - net-tools
      - openssh-server
      - curl
      - wget
  
  # Configure GDM for auto-login
  - type: create_file
    path: /etc/gdm3/custom.conf
    content: |
      [daemon]
      AutomaticLoginEnable=true
      AutomaticLogin=iontest
      WaylandEnable=true
    mode: "0644"
  
  - type: enable_service
    service: gdm3
  
  - type: enable_service
    service: ssh
  
  - type: run_command
    command: systemctl set-default graphical.target
    description: Set graphical boot target
  
  # Install RustDesk from local package
  - type: run_command
    command: |
      apt-get install -y libxcb-randr0 libxcb-xtest0 libxcb-xfixes0 libxcb-shape0 libxcb-xkb1 libxcb-keysyms1 libxcb-cursor0
    description: Install RustDesk dependencies
  
  - type: download_file
    url: https://github.com/rustdesk/rustdesk/releases/download/1.2.3/rustdesk-1.2.3-x86_64.deb
    dest: /tmp/rustdesk.deb
  
  - type: run_command
    command: apt-get install -y /tmp/rustdesk.deb
    description: Install RustDesk from .deb package
  
  # Configure RustDesk for unattended access
  - type: create_file
    path: /home/iontest/.config/rustdesk/RustDesk.toml
    content: |
      [options]
      password = "iontest123"
    mode: "0644"
  
  - type: run_command
    command: chown -R iontest:iontest /home/iontest/.config/rustdesk
    description: Set RustDesk config ownership
  
  # Create marker file for validation
  - type: run_command
    command: |
      cat > /etc/ionchannel-substrate <<EOF
      substrate=ubuntu24-rustdesk
      version=1.0.0
      build_date=$(date -Iseconds)
      wayland=gnome
      rustdesk=installed
      EOF
    description: Create substrate marker file

verification:
  required_packages:
    - ubuntu-desktop-minimal
    - gdm3
    - gnome-shell
  
  required_services:
    - gdm3
    - ssh
  
  required_files:
    - /usr/bin/gnome-shell
    - /usr/sbin/gdm3
    - /etc/ionchannel-substrate
  
  verification_commands:
    - command: systemctl is-enabled gdm3
      expected_exit_code: 0
      description: GDM3 should be enabled
    
    - command: test -f /etc/ionchannel-substrate
      expected_exit_code: 0
      description: Substrate marker file should exist

metadata:
  purpose: ionchannel-validation
  substrate_type: ubuntu-rustdesk
  os: ubuntu
  os_version: "24.04"
  desktop: gnome
  wayland: true
  rustdesk: true
  exportable: true


