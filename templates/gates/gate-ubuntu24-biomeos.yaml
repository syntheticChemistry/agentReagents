# SPDX-License-Identifier: AGPL-3.0-only
# Gate Template: biomeOS deployment substrate
#
# Minimal Ubuntu 24.04 gate with biomeOS stack pre-deployed:
# Songbird + BearDog + NestGate from plasmidBin, firewall rules,
# systemd units, health verification.
#
# Reference: infra/wateringHole/GATE_DEPLOYMENT_STANDARD.md

name: gate-ubuntu24-biomeos
version: "1.0.0"
base_image: ubuntu-24.04-server-cloudimg-amd64.img
description: >
  Standard biomeOS gate substrate. Deploys Songbird (registry),
  BearDog (crypto), and NestGate (auth) as systemd services.
  Suitable for Eastgate and biomeGate deployments.

resources:
  memory_mb: 4096
  vcpus: 4
  disk_gb: 40
  timeout_secs: 3600

users:
  - name: biomegate
    groups: [sudo, docker]
    ssh_authorized_keys: []

build_steps:
  - type: wait_cloud_init
    timeout_secs: 600

  - type: install_packages
    packages:
      - openssh-server
      - curl
      - ca-certificates
      - iproute2
      - iptables
      - jq

  - type: enable_service
    service: ssh

  - type: run_command
    command: "ufw allow 22/tcp && ufw allow 9100/tcp && ufw allow 9200/tcp && ufw allow 9500/tcp && ufw --force enable"
    description: "Configure firewall for SSH and Tower+NestGate ports"

  - type: create_file
    path: /etc/biomeos/gate.conf
    content: |
      GATE_TYPE=biomeos
      GATE_ROLE=standard
      PRIMAL_PORT_RANGE=9100-9900
    mode: "0644"

post_boot_steps:
  - type: run_command
    command: "mkdir -p /opt/plasmidBin /etc/biomeos /var/log/biomeos"
    description: "Create deployment directory structure"

  - type: run_command
    command: |
      PLASMID_BIN="${PLASMID_BIN:-/opt/plasmidBin}"
      ARCH="$(uname -m)"
      SRC="${PLASMID_BIN}/primals/${ARCH}"
      for primal in songbird beardog nestgate; do
        if [ -f "${SRC}/${primal}" ]; then
          cp "${SRC}/${primal}" /opt/plasmidBin/
        elif command -v fetch.sh >/dev/null 2>&1; then
          fetch.sh pull "${primal}" --arch "${ARCH}" --dest /opt/plasmidBin/
        fi
      done
      chmod +x /opt/plasmidBin/* 2>/dev/null || true
    description: "Deploy primals from plasmidBin (postPrimordial)"

  - type: create_file
    path: /etc/systemd/system/songbird.service
    content: |
      [Unit]
      Description=Songbird Service Registry
      After=network-online.target
      Wants=network-online.target

      [Service]
      Type=simple
      ExecStart=/opt/plasmidBin/songbird server --port 9200 --standalone
      Restart=on-failure
      RestartSec=5
      Environment=RUST_LOG=info

      [Install]
      WantedBy=multi-user.target
    mode: "0644"

  - type: create_file
    path: /etc/systemd/system/beardog.service
    content: |
      [Unit]
      Description=BearDog Cryptographic Services
      After=network-online.target songbird.service
      Wants=network-online.target

      [Service]
      Type=simple
      ExecStart=/opt/plasmidBin/beardog server --port 9100 --standalone
      Restart=on-failure
      RestartSec=5
      Environment=RUST_LOG=info

      [Install]
      WantedBy=multi-user.target
    mode: "0644"

  - type: create_file
    path: /etc/systemd/system/nestgate.service
    content: |
      [Unit]
      Description=NestGate Authentication
      After=network-online.target songbird.service beardog.service
      Wants=network-online.target

      [Service]
      Type=simple
      ExecStart=/opt/plasmidBin/nestgate server --port 9500 --standalone
      Restart=on-failure
      RestartSec=5
      Environment=RUST_LOG=info

      [Install]
      WantedBy=multi-user.target
    mode: "0644"

  - type: enable_service
    service: songbird
    start: true

  - type: enable_service
    service: beardog
    start: true

  - type: enable_service
    service: nestgate
    start: true

verification:
  required_packages:
    - openssh-server
    - iproute2
    - iptables
    - jq
  required_services:
    - ssh
  required_files:
    - /etc/biomeos/gate.conf
    - /opt/plasmidBin
  verification_commands:
    - command: "test -d /opt/plasmidBin"
      description: "plasmidBin binary directory exists"
      expected_exit_code: 0
    - command: "ufw status | grep -q active"
      description: "Firewall is active"
      expected_exit_code: 0

metadata:
  gate_standard: "GATE_DEPLOYMENT_STANDARD.md"
  target_gates: "eastgate,biomegate"
  arch: "x86_64"
