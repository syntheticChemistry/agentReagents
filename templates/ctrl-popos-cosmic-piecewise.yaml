name: ctrl-popos-cosmic-piecewise
version: 3.0.0
description: |
  Pop!_OS 24.04 with COSMIC + RustDesk CONTROL SUBSTRATE
  
  Piecewise Laboratory Synthesis - A/B Testing Control
  ====================================================
  This is the "Wayland issue" control - RustDesk should FAIL on COSMIC.
  
  Built using identical methodology to Ubuntu control:
  - Phase 1: Autoclave (cloud-init minimal base)
  - Phase 2: Piecewise compound addition (post-boot stepwise)
  - Phase 3: Validation at each step
  
  Expected Behavior:
  - Pop!_OS COSMIC uses Wayland by default
  - RustDesk has known Wayland compatibility issues
  - This control should demonstrate the problem
  - ionChannel deployment should solve it

base_image: /home/flockgate/Developemt/syntheticChemistry/agentReagents/images/cloud/ubuntu-24.04-server-cloudimg-amd64.img

resources:
  memory_mb: 8192
  vcpus: 4
  disk_gb: 40
  timeout_secs: 3600
  # Evolution #12: DHCP discovery (no static_ip - parallel builds, no sudo issues)

users:
  - name: poptest
    sudo: ALL NOPASSWD:ALL
    ssh_authorized_keys:
      - ssh-rsa  biomeOS-ionChannel-validation

build_steps:
  # Cloud-init: Minimal autoclave phase
  - type: install_packages
    packages:
      - openssh-server
      - net-tools
      - curl
      - wget
      - vim
      - git
  - type: wait_cloud_init
    timeout_secs: 600  # Longer wait for cloud-init to stabilize

post_boot_steps:
  # Step 1: Update package lists
  - type: run_command
    command: "sudo apt-get update"
    description: "Update APT package lists"
    timeout_secs: 120

  # Step 2: Verify base VM
  - type: run_command
    command: "echo 'Base VM functional' && free -h && df -h / | tail -1"
    description: "Validate base VM (memory, disk)"
    timeout_secs: 30

  # Step 3: Add Pop!_OS repository
  - type: run_command
    command: "sudo add-apt-repository -y ppa:system76/pop && sudo apt-get update"
    description: "Add Pop!_OS PPA"
    timeout_secs: 180

  # Step 4: Verify repository
  - type: run_command
    command: "apt-cache policy | grep -i pop && echo 'Pop!_OS repo added'"
    description: "Validate Pop!_OS repository"
    timeout_secs: 30

  # Step 5: Install Wayland foundations
  - type: install_packages
    packages:
      - wayland-protocols
      - libwayland-client0
      - libwayland-server0
    timeout_secs: 300
    description: "Install Wayland foundations"

  # Step 6: Verify Wayland
  - type: run_command
    command: "dpkg -l | grep wayland && echo 'Wayland installed'"
    description: "Validate Wayland installation"
    timeout_secs: 30

  # Step 7: Install COSMIC desktop core (this will be large)
  - type: install_packages
    packages:
      - cosmic-session
      - cosmic-greeter
      - cosmic-comp
    timeout_secs: 1200
    description: "Install COSMIC desktop core"

  # Step 8: Verify COSMIC core
  - type: run_command
    command: "dpkg -l | grep cosmic && echo 'COSMIC core installed'"
    description: "Validate COSMIC core"
    timeout_secs: 30

  # Step 9: Install COSMIC applications
  - type: install_packages
    packages:
      - cosmic-settings
      - cosmic-files
      - cosmic-term
    timeout_secs: 900
    description: "Install COSMIC applications"

  # Step 10: Verify COSMIC apps
  - type: run_command
    command: "which cosmic-settings && which cosmic-term && echo 'COSMIC apps installed'"
    description: "Validate COSMIC applications"
    timeout_secs: 30

  # Step 11: Install RustDesk dependencies (Evolution #23: Ubuntu 24.04 renamed libgtk-3-0 → libgtk-3-0t64)
  - type: install_packages
    packages:
      - libgtk-3-0t64
      - libxcb-shape0
      - libxcb-xfixes0
      - libxdo3
      - libayatana-appindicator3-1
    timeout_secs: 300
    description: "Install RustDesk dependencies"

  # Step 12: Verify dependencies
  - type: run_command
    command: "dpkg -l | grep libgtk-3-0t64 && echo 'RustDesk dependencies installed'"
    description: "Validate RustDesk dependencies"
    timeout_secs: 30

  # Step 13: Download RustDesk
  - type: run_command
    command: "wget -O /tmp/rustdesk-1.2.3-x86_64.deb https://github.com/rustdesk/rustdesk/releases/download/1.2.3/rustdesk-1.2.3-x86_64.deb"
    description: "Download RustDesk"
    timeout_secs: 180

  # Step 14: Verify download
  - type: run_command
    command: "ls -lh /tmp/rustdesk-1.2.3-x86_64.deb && echo 'RustDesk downloaded'"
    description: "Validate RustDesk download"
    timeout_secs: 30

  # Step 15: Install RustDesk
  - type: run_command
    command: "sudo apt install -y /tmp/rustdesk-1.2.3-x86_64.deb"
    description: "Install RustDesk package"
    timeout_secs: 300

  # Step 16: Verify RustDesk
  - type: run_command
    command: "which rustdesk && dpkg -l | grep rustdesk && echo 'RustDesk installed'"
    description: "Validate RustDesk installation"
    timeout_secs: 30

  # Step 17: Enable COSMIC greeter
  - type: enable_service
    service: cosmic-greeter
    timeout_secs: 60

  # Step 18: Final system check
  - type: run_command
    command: "echo 'Final check:' && df -h / | tail -1 && free -h | grep Mem && systemctl is-enabled cosmic-greeter && echo 'Wayland check:' && loginctl show-session $(loginctl | grep $(whoami) | awk '{print $1}') -p Type 2>/dev/null || echo 'Will be Wayland after reboot'"
    description: "Final system validation"
    timeout_secs: 30

  # Step 19: Reboot into COSMIC
  - type: reboot
    wait_secs: 120
    timeout_secs: 300

verification:
  required_packages:
    - openssh-server
    - wayland-protocols
    - cosmic-session
    - cosmic-greeter
    - cosmic-settings
    - cosmic-term
    - rustdesk
  required_services:
    - ssh
    - cosmic-greeter
  verification_commands:
    - command: "systemctl is-active cosmic-greeter"
      expected_exit_code: 0
      description: "Check if COSMIC greeter is running"
    - command: "test -f /usr/bin/rustdesk"
      expected_exit_code: 0
      description: "Check for rustdesk binary"
    - command: "echo $XDG_SESSION_TYPE"
      expected_exit_code: 0
      description: "Check session type (should be wayland)"

