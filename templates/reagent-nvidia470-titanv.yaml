name: reagent-nvidia470-titanv
version: 2.0.0
description: |
  Sovereign compute VM for Titan V (GV100) via nvidia-470 passthrough.

  GPU passed through via VFIO. nvidia-470 initializes HBM2, boots GR/FECS via
  PMU→ACR→FECS authentication chain. Compute runs INSIDE the VM using CUDA 11.4
  Driver API with pre-compiled PTX/cubin kernels.

  ARCHITECTURE DECISION (2026-05-11):
  nvidia-470 uses DMA-based firmware upload to GPU-internal falcons (PMU, FECS, GPCCS).
  This initialization is invisible to host-side MMIO tracing and cannot be replayed
  from a static register dump. VFIO performs SBR (Secondary Bus Reset) on IOMMU group
  release, destroying trained GPU state. Therefore:
  - Warm-handoff approach is NOT viable (SBR resets HBM2/FECS on VM shutdown)
  - DifferentialReplay of golden state is NOT viable (init is DMA+firmware, not MMIO)
  - The VM itself IS the sovereign compute platform

  The host DRM (nvidia-580 + RTX 5060 display) remains completely uninterrupted.

  nvidia-470 is the ONLY driver that:
    1. Supports GV100 (Titan V) — nvidia-580 requires GSP (Turing+)
    2. Boots GR/FECS via PMU→ACR→FECS authentication with embedded falcon firmware
    3. Trains 12 GB HBM2 (3072-bit bus, 653 GB/s bandwidth)
  nouveau lacks PMU firmware for Volta ACR. Direct PIO fails (FECS is HS-secured).

  VERIFIED COMPUTE (2026-05-11):
    - VectorAdd (1M elements): PASS
    - HBM2 memset/memcpy roundtrip: PASS (0xCAFEBABE, 0xDEADBEEF)
    - 10 GB allocation: PASS (full HBM2 addressable)
    - PCIe bandwidth: 6.5 GB/s H2D, 6.4 GB/s D2H (x8 Gen3)
    - 80 SMs, sm_70, 1455 MHz core, 850 MHz mem

base_image: images/cloud/ubuntu-24.04-server-cloudimg-amd64.img

resources:
  memory_mb: 4096
  vcpus: 4
  disk_gb: 30
  timeout_secs: 600

pci_passthrough:
  - bdf: "0000:02:00.0"
    no_flr: true
    attach_mode: cold
    rom_bar: false
    managed: false
    qemu_properties:
      x-no-mmap: "on"

users:
  - name: reagent
    password: reagent
    groups:
      - sudo
      - users

build_steps:
  - type: wait_cloud_init
    timeout_secs: 300

  - type: install_packages
    packages:
      - linux-headers-generic
      - build-essential
      - pciutils
      - kmod
      - wget
      - gcc-11
      - g++-11

  - type: download_file
    url: "http://192.168.122.1:8470/nvidia-470.256.02.run"
    dest: /opt/reagent/nvidia-470.run

  - type: create_file
    path: /opt/reagent/warm-handoff.sh
    content: |
      #!/bin/bash
      set -euo pipefail

      log() { echo "[$(date '+%H:%M:%S')] $*"; }

      GPU_BDF=$(lspci -d 10de:1d81 -D | head -1 | awk '{print $1}')
      if [ -z "$GPU_BDF" ]; then
        echo "ERROR: No Titan V (10de:1d81) found in VM"
        exit 1
      fi
      log "Found Titan V at $GPU_BDF"

      log "Installing nvidia-470 from .run installer..."
      chmod +x /opt/reagent/nvidia-470.run
      /opt/reagent/nvidia-470.run --no-questions --no-drm --no-x-check --silent 2>&1 || {
        log "Installer exit code $? — trying manual insmod fallback..."
        MODDIR=$(find /usr/lib/modules/$(uname -r) -name nvidia.ko -path "*/470*" 2>/dev/null | head -1)
        if [ -n "$MODDIR" ]; then
          insmod "$MODDIR" NVreg_OpenRmEnableUnsupportedGpus=1
        else
          log "FATAL: Could not locate nvidia-470 module"
          exit 1
        fi
      }

      log "Waiting for GPU initialization (GR/FECS/HBM2)..."
      sleep 10

      log "Checking nvidia driver status..."
      if lsmod | grep -q nvidia; then
        log "nvidia-470 loaded"
      else
        log "WARNING: nvidia module not in lsmod"
      fi

      log "Checking GPU power state..."
      cat /sys/bus/pci/devices/$GPU_BDF/power_state 2>/dev/null || true

      log "Checking dmesg for NVRM messages..."
      dmesg | grep -i "NVRM\|nvidia\|gv100\|gr\|fecs" | tail -20 || true

      log "GR/FECS initialization complete. GPU is warm."

      log "Installing CUDA 11.4 toolkit..."
      wget -q https://developer.download.nvidia.com/compute/cuda/11.4.4/local_installers/cuda_11.4.4_470.82.01_linux.run -O /tmp/cuda_11.4.run
      chmod +x /tmp/cuda_11.4.run
      /tmp/cuda_11.4.run --silent --toolkit --no-drm --no-man-page --override 2>&1 || true
      rm -f /tmp/cuda_11.4.run

      log "Fixing libcuda symlinks for nvidia-470..."
      rm -f /usr/lib/x86_64-linux-gnu/libcuda.so.535* 2>/dev/null || true
      ln -sf libcuda.so.470.256.02 /usr/lib/x86_64-linux-gnu/libcuda.so.1
      ln -sf libcuda.so.1 /usr/lib/x86_64-linux-gnu/libcuda.so
      ldconfig

      if /usr/local/cuda-11.4/bin/ptxas --version 2>/dev/null; then
        log "CUDA 11.4 toolkit installed OK"
      else
        log "WARNING: CUDA toolkit not fully installed"
      fi

      touch /opt/reagent/SOVEREIGN_COMPUTE_READY
    mode: "0755"

  - type: run_command
    command: "sudo /opt/reagent/warm-handoff.sh"
    description: "Install nvidia-470, CUDA 11.4, configure sovereign compute"

verification:
  required_files:
    - /opt/reagent/warm-handoff.sh
    - /opt/reagent/SOVEREIGN_COMPUTE_READY
  verification_commands:
    - command: "lspci -d 10de:1d81"
      expected_exit_code: 0
      description: "Titan V visible via PCI passthrough"
    - command: "nvidia-smi -q -d MEMORY"
      expected_exit_code: 0
      description: "nvidia-smi reports HBM2 memory"
    - command: "/usr/local/cuda-11.4/bin/ptxas --version"
      expected_exit_code: 0
      description: "CUDA 11.4 ptxas available for kernel compilation"
    - command: "test -f /opt/reagent/SOVEREIGN_COMPUTE_READY"
      expected_exit_code: 0
      description: "Sovereign compute environment ready"

# NOTE: post_actions are documentation only — agentReagents does not execute them.
# The VM runs as a PERSISTENT compute platform, NOT a disposable warm-handoff.
# Compute workloads run INSIDE the VM via SSH + CUDA Driver API.
# VM lifecycle: start → compute → (keep running) → shutdown when done.
post_actions:
  - type: note
    description: |
      WARM-HANDOFF IS NOT VIABLE: VFIO performs SBR on IOMMU group release
      when the VM shuts down, destroying all trained GPU state.
      nvidia-470 uses DMA-based falcon firmware upload, not MMIO writes,
      so the init sequence cannot be replayed from a register dump.
      The VM IS the sovereign compute platform.

metadata:
  gpu: "Titan V (GV100)"
  driver: "nvidia-470.256.02"
  cuda: "11.4"
  purpose: "sovereign-compute-vm"
  disposable: "false"
  host_drm_impact: "none"
  verified: "2026-05-11"
  compute_verified:
    vectoradd: "PASS (1M elements)"
    hbm2_alloc: "PASS (10 GB)"
    hbm2_memcpy: "PASS (0xCAFEBABE roundtrip)"
    pcie_bandwidth: "6.5 GB/s H2D, 6.4 GB/s D2H"
