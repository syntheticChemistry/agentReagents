name: reagent-nvidia470-titanv
version: 1.0.0
description: |
  Disposable VM for GR/FECS/HBM2 warm-handoff on Titan V (GV100) via nvidia-470.
  GPU passed through via VFIO. nvidia-470 boots GR/FECS with embedded PMU firmware.
  VM shuts down cleanly — host reclaims warm device (reset_method=none preserves state).
  coral-ember then opens the warm GPU for sovereign compute.

  This is the production warm-handoff path. It keeps the host DRM (nvidia-580 + RTX 5060
  display) completely uninterrupted. No host-side driver swaps, no kernel crash risk.

  nvidia-470 is the ONLY driver that:
    1. Supports GV100 (Titan V)
    2. Boots GR/FECS (SEC2 → ACR → FECS authentication with embedded PMU firmware)
    3. Trains HBM2
  nouveau skips GR on GV100 (PMU firmware unavailable).
  nvidia-580 does not support GV100.
  Direct PIO fails (FECS is a secure falcon).

base_image: images/cloud/ubuntu-24.04-server-cloudimg-amd64.img

resources:
  memory_mb: 4096
  vcpus: 4
  disk_gb: 30
  timeout_secs: 600

pci_passthrough:
  - bdf: "0000:02:00.0"
    reset_on_release: false

users:
  - name: reagent
    password: reagent
    groups:
      - sudo
      - users

build_steps:
  - type: wait_cloud_init
    timeout_secs: 300

  - type: install_packages
    packages:
      - linux-headers-generic
      - build-essential
      - pciutils
      - kmod
      - wget

  - type: upload_file
    source: tools/titanv-sovereign/nvidia-470.256.02.run
    dest: /opt/reagent/nvidia-470.run
    description: "Pre-downloaded nvidia-470 .run installer"

  - type: create_file
    path: /opt/reagent/warm-handoff.sh
    content: |
      #!/bin/bash
      set -euo pipefail

      log() { echo "[$(date '+%H:%M:%S')] $*"; }

      GPU_BDF=$(lspci -d 10de:1d81 -D | head -1 | awk '{print $1}')
      if [ -z "$GPU_BDF" ]; then
        echo "ERROR: No Titan V (10de:1d81) found in VM"
        exit 1
      fi
      log "Found Titan V at $GPU_BDF"

      log "Installing nvidia-470 from .run installer..."
      chmod +x /opt/reagent/nvidia-470.run
      /opt/reagent/nvidia-470.run --no-questions --no-drm --no-x-check --silent 2>&1 || {
        log "Installer exit code $? — trying manual insmod fallback..."
        MODDIR=$(find /usr/lib/modules/$(uname -r) -name nvidia.ko -path "*/470*" 2>/dev/null | head -1)
        if [ -n "$MODDIR" ]; then
          insmod "$MODDIR" NVreg_OpenRmEnableUnsupportedGpus=1
        else
          log "FATAL: Could not locate nvidia-470 module"
          exit 1
        fi
      }

      log "Waiting for GPU initialization (GR/FECS/HBM2)..."
      sleep 10

      log "Checking nvidia driver status..."
      if lsmod | grep -q nvidia; then
        log "nvidia-470 loaded"
      else
        log "WARNING: nvidia module not in lsmod"
      fi

      log "Checking GPU power state..."
      cat /sys/bus/pci/devices/$GPU_BDF/power_state 2>/dev/null || true

      log "Checking dmesg for NVRM messages..."
      dmesg | grep -i "NVRM\|nvidia\|gv100\|gr\|fecs" | tail -20 || true

      log "GR/FECS initialization complete. GPU is warm."
      log "VM will shut down — host reclaims device with warm state."

      touch /opt/reagent/WARM_HANDOFF_COMPLETE
    mode: "0755"

  - type: run_command
    command: "sudo /opt/reagent/warm-handoff.sh"
    timeout_secs: 120

verification:
  required_files:
    - /opt/reagent/warm-handoff.sh
    - /opt/reagent/WARM_HANDOFF_COMPLETE
  verification_commands:
    - command: "lspci -d 10de:1d81"
      expected_exit_code: 0
      description: "Titan V visible via PCI passthrough"
    - command: "test -f /opt/reagent/WARM_HANDOFF_COMPLETE"
      expected_exit_code: 0
      description: "Warm-handoff completed successfully"

post_actions:
  - type: host_command
    description: "Set reset_method=none on Titan V before VM shutdown"
    command: "echo none > /sys/bus/pci/devices/0000:02:00.0/reset_method"
  - type: host_command
    description: "Rebind Titan V to vfio-pci (warm state preserved)"
    command: |
      echo vfio-pci > /sys/bus/pci/devices/0000:02:00.0/driver_override
      echo 0000:02:00.0 > /sys/bus/pci/drivers/vfio-pci/bind 2>/dev/null || true
  - type: host_command
    description: "Restart diesel engine to pick up warm Titan V"
    command: "systemctl restart coral-glowplug.service"

metadata:
  gpu: "Titan V (GV100)"
  driver: "nvidia-470.256.02"
  purpose: "warm-handoff-gr-fecs"
  disposable: "true"
  host_drm_impact: "none"
