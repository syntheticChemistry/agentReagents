name: ubuntu-24-04-rustdesk
version: 1.0.0
base_image: ubuntu-24.04-server-cloudimg-amd64.img
description: Ubuntu 24.04 with desktop and RustDesk for remote access

resources:
  memory_mb: 4096
  vcpus: 2
  disk_gb: 30
  timeout_secs: 2400

build_steps:
  - type: wait_cloud_init
    timeout_secs: 600
  
  - type: install_packages
    packages:
      - ubuntu-desktop-minimal
      - gdm3
      - firefox
      - gnome-terminal
      - wget
      - curl
  
  - type: download_file
    url: https://github.com/rustdesk/rustdesk/releases/download/1.2.3/rustdesk-1.2.3-x86_64.deb
    dest: /tmp/rustdesk.deb
  
  - type: run_command
    command: apt-get install -y /tmp/rustdesk.deb || apt-get install -f -y
    description: Install RustDesk
  
  - type: enable_service
    service: gdm3
  
  - type: enable_service
    service: rustdesk

  - type: run_command
    command: systemctl set-default graphical.target
    description: Set graphical boot target

verification:
  required_packages:
    - ubuntu-desktop-minimal
    - gdm3
  
  required_services:
    - gdm3
  
  required_files:
    - /usr/bin/gnome-shell
    - /usr/bin/rustdesk
  
  verification_commands:
    - command: which rustdesk
      expected_exit_code: 0
      description: RustDesk should be installed
    
    - command: systemctl is-enabled gdm3
      expected_exit_code: 0
      description: GDM3 should be enabled

metadata:
  os: ubuntu
  os_version: "24.04"
  desktop: gnome
  remote_access: rustdesk

