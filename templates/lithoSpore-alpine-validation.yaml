name: lithoSpore-alpine-validation
version: 1.0.0
description: |
  Alpine Linux minimal VM for lithoSpore musl-static portability testing.
  Alpine uses musl libc natively (no glibc), BusyBox coreutils, and no
  systemd — proving the musl-static binary runs on the most minimal
  Linux environment possible. No package manager, no build tools.

  Deployment pattern: minimal-musl (edge/IoT/embedded).

base_image: images/cloud/alpine-3.21-virt-x86_64.iso

resources:
  memory_mb: 512
  vcpus: 1
  disk_gb: 4
  timeout_secs: 300

users:
  - name: litho
    groups:
      - wheel
    sudo: true
    shell: /bin/ash
    lock_passwd: false
    ssh_authorized_keys: []

build_steps:
  - type: install_packages
    packages:
      - openssh

  - type: enable_service
    service: sshd

  - type: create_file
    path: /etc/lithoSpore-gate
    content: |
      gate=lithoSpore-alpine-validation
      version=1.0.0
      purpose=musl-portability-validation
      tier_max=2
      deployment_pattern=alpine-minimal
      libc=musl
    mode: "0644"

post_boot_steps:
  - type: run_command
    command: mkdir -p /opt/lithoSpore && chmod 0755 /opt/lithoSpore && chown litho:litho /opt/lithoSpore
    timeout_secs: 30

validation_steps:
  - name: artifact_extract
    command: |
      mkdir -p /opt/lithoSpore
      tar xzf /tmp/lithoSpore-usb.tar.gz -C /opt/lithoSpore
    timeout_secs: 30
    description: Extract lithoSpore tarball

  - name: binary_check
    command: file /opt/lithoSpore/bin/litho
    expected_output_contains: "statically linked"
    timeout_secs: 5
    description: Verify litho is a static binary (musl-on-musl)

  - name: no_glibc_check
    command: "! ldd /opt/lithoSpore/bin/litho 2>&1 | grep -q 'libc.so'"
    expected_exit_code: 0
    timeout_secs: 5
    description: Confirm no glibc dependency

  - name: self_test
    command: /opt/lithoSpore/bin/litho self-test --artifact-root /opt/lithoSpore
    expected_exit_code: 0
    timeout_secs: 30
    description: Artifact integrity self-test

  - name: tier_detection
    command: /opt/lithoSpore/bin/litho tier --artifact-root /opt/lithoSpore
    expected_exit_code: 0
    timeout_secs: 10
    description: Tier detection on Alpine

  - name: full_validation
    command: /opt/lithoSpore/bin/litho validate --artifact-root /opt/lithoSpore --json
    expected_exit_code: 0
    timeout_secs: 120
    description: Full Tier 2 validation on musl-native Alpine

  - name: data_verify
    command: /opt/lithoSpore/bin/litho verify --artifact-root /opt/lithoSpore --json
    expected_exit_code: 0
    timeout_secs: 30
    description: Data integrity verification (BLAKE3 hashes)

  - name: hostname_detection
    command: /opt/lithoSpore/bin/litho spore --artifact-root /opt/lithoSpore 2>&1 | head -5
    expected_exit_code: 0
    timeout_secs: 5
    description: Hostname discovery works on Alpine (no /proc/sys/kernel/hostname)

verification:
  required_files:
    - /etc/lithoSpore-gate

  verification_commands:
    - command: id litho
      expected_exit_code: 0
      description: User litho should exist

    - command: test -d /opt/lithoSpore
      expected_exit_code: 0
      description: lithoSpore mount point should exist

    - command: cat /etc/os-release | head -1
      expected_output_contains: Alpine
      description: Confirm Alpine OS

metadata:
  os: alpine
  os_version: "3.21"
  purpose: lithoSpore-musl-portability
  fast_boot: true
  minimal: true
  project: ecoPrimals/CATHEDRAL
  deployment_pattern: alpine-minimal
  requires_libvirt: true
