name: ubuntu24-desktop
version: 1.0.0
description: |
  Ubuntu 24.04 LTS + GNOME Desktop (Step 2 - builds from cloud image)
  Includes minimal server + desktop environment
  Uses cloud-init for package installation
  
base_image: images/cloud/ubuntu-24.04-server-cloudimg-amd64.img

resources:
  memory_mb: 6144  # Increased for desktop package installation
  vcpus: 3
  disk_gb: 35
  timeout_secs: 1800  # 30 min for desktop packages

users:
  - name: ubuntutest
    password: ubuntu123
    groups:
      - sudo
      - users
    ssh_authorized_keys: []

build_steps:
  # Include base server packages  
  - type: install_packages
    packages:
      - openssh-server
      - net-tools
      - curl
      - wget
      - vim
      - build-essential
      - python3
      - python3-pip
  
  # Desktop packages installed together (cloud-init handles this in one transaction)
  - type: install_packages
    packages:
      - ubuntu-desktop-minimal
      - gdm3
      - gnome-terminal
      - firefox
      - gnome-shell-extensions
  
  # Step 3: Configure GDM for auto-login
  - type: run_command
    command: |
      sudo tee /etc/gdm3/custom.conf > /dev/null <<'EOF'
      [daemon]
      AutomaticLoginEnable=true
      AutomaticLogin=ubuntutest
      WaylandEnable=true
      [security]
      [xdmcp]
      [chooser]
      [debug]
      EOF
    description: "Configure GDM3 auto-login"
  
  # Step 4: Enable desktop services
  - type: run_command
    command: sudo systemctl enable gdm3
    description: "Enable GDM3 service"
  
  # Step 5: Create completion markers
  - type: run_command
    command: |
      sudo tee /root/STEP_1_COMPLETE > /dev/null <<'EOF'
      Ubuntu 24.04 Minimal Server - Step 1 Complete (integrated)
      Date: $(date)
      Base packages installed
      EOF
    description: "Create Step 1 marker"
  
  - type: run_command
    command: |
      sudo tee /root/STEP_2_COMPLETE > /dev/null <<'EOF'
      Ubuntu 24.04 Desktop Environment - Step 2 Complete
      Date: $(date)
      Desktop: GNOME
      Display Manager: GDM3
      Auto-login: ubuntutest
      Next: Install RustDesk (Step 3)
      EOF
    description: "Create Step 2 marker"

verification:
  required_packages:
    - ubuntu-desktop-minimal
    - gdm3
    - gnome-terminal
    - firefox
  required_services:
    - gdm3
  required_files:
    - /root/STEP_1_COMPLETE
    - /root/STEP_2_COMPLETE

