name: ctrl-ubuntu24-rust-piecewise
version: 3.0.0
description: |
  Ubuntu 24.04 LTS with GNOME + RustDesk CONTROL SUBSTRATE
  
  Piecewise Laboratory Synthesis (Granular Steps with Validation)
  ================================================================
  Like a chemistry lab, we add each compound separately and verify
  stability before proceeding to the next step.
  
  Phase 1: Autoclave (cloud-init minimal base)
  Phase 2: Add compounds one at a time (post-boot stepwise)
  Phase 3: Verify each addition before proceeding
  
  This prevents "Maillard reactions" (package conflicts) and allows
  us to identify exactly which compound causes precipitation (failure).

base_image: images/cloud/ubuntu-24.04-server-cloudimg-amd64.img

resources:
  memory_mb: 8192
  vcpus: 4
  disk_gb: 35
  timeout_secs: 3600

users:
  - name: ubuntutest
    sudo: ALL NOPASSWD:ALL
    ssh_authorized_keys:
      - ssh-rsa CHANGEME_INSERT_YOUR_PUBLIC_KEY builder@gate

cloud_init_timeout_secs: 600

build_steps:
  # Cloud-init: ALL packages installed here for speed and reliability
  - type: install_packages
    packages:
      # Core infrastructure
      - openssh-server
      - net-tools
      - curl
      - wget
      - vim
      # Desktop environment (moved from post-boot - eliminates SSH hang)
      - xorg
      - xserver-xorg-core
      - gnome-shell
      - gnome-session
      - gdm3
      - gnome-terminal
      - gnome-control-center
      # RustDesk dependencies
      - libgtk-3-0t64
      - libxcb-shape0
      - libxcb-xfixes0
      - libxdo3
      - libayatana-appindicator3-1
      - gdebi-core
  - type: wait_cloud_init
    timeout_secs: 600

post_boot_steps:
  # Step 1: Verify desktop environment from cloud-init
  - type: run_command
    command: "echo 'Validating cloud-init packages...' && dpkg -l | grep -E '(xserver-xorg-core|gnome-shell|gdm3)' && echo 'Desktop environment ready!'"
    description: "Validate desktop environment (from cloud-init)"
    timeout_secs: 30

  # Step 2: Download RustDesk
  - type: run_command
    command: "wget -O /tmp/rustdesk-1.2.3-x86_64.deb https://github.com/rustdesk/rustdesk/releases/download/1.2.3/rustdesk-1.2.3-x86_64.deb"
    description: "Download RustDesk"
    timeout_secs: 180

  # Step 3: Verify download
  - type: run_command
    command: "ls -lh /tmp/rustdesk-1.2.3-x86_64.deb && echo 'RustDesk downloaded'"
    description: "Validate RustDesk download"
    timeout_secs: 30

  # Step 4: Install RustDesk using gdebi (handles dependencies)
  - type: run_command
    command: "sudo gdebi -n /tmp/rustdesk-1.2.3-x86_64.deb"
    description: "Install RustDesk package"
    timeout_secs: 300

  # Step 5: Verify RustDesk installation
  - type: run_command
    command: "which rustdesk && dpkg -l | grep rustdesk && echo 'RustDesk installed successfully!'"
    description: "Validate RustDesk installation"
    timeout_secs: 30

  # Step 6: Enable GDM3 service
  - type: enable_service
    service: gdm3
    timeout_secs: 60

  # Step 7: Final system validation
  - type: run_command
    command: "echo '=== CONTROL SUBSTRATE READY ===' && echo 'Disk:' && df -h / | tail -1 && echo 'Memory:' && free -h | grep Mem && echo 'Services:' && systemctl is-enabled gdm3 && echo 'RustDesk:' && rustdesk --version"
    description: "Final system validation"
    timeout_secs: 30

  # Step 8: Reboot into desktop
  - type: reboot
    wait_secs: 120
    timeout_secs: 300

verification:
  required_packages:
    - openssh-server
    - xserver-xorg-core
    - gnome-shell
    - gdm3
    - gnome-terminal
    - libgtk-3-0t64
    - rustdesk
  required_services:
    - ssh
    - gdm3
  verification_commands:
    - command: "systemctl is-active gdm3"
      expected_exit_code: 0
      description: "Check if GDM3 is running"
    - command: "test -f /usr/bin/rustdesk"
      expected_exit_code: 0
      description: "Check for rustdesk binary"

