name: lithoSpore-fedora-validation
version: 1.0.0
description: |
  Fedora cloud VM for lithoSpore cross-distro portability testing.
  RPM-based, SELinux-enabled, dnf package manager, different filesystem
  layout conventions than Debian/Ubuntu. Proves musl-static binary works
  on Red Hat-family distributions.

  Deployment pattern: fedora-cloud (RPM-based validation).

base_image: images/cloud/Fedora-Cloud-Base-42-1.1.x86_64.qcow2

resources:
  memory_mb: 2048
  vcpus: 2
  disk_gb: 20
  timeout_secs: 900

users:
  - name: litho
    groups:
      - wheel
    sudo: true
    shell: /bin/bash
    lock_passwd: false
    ssh_authorized_keys: []

build_steps:
  - type: install_packages
    packages:
      - openssh-server
      - qemu-guest-agent

  - type: enable_service
    service: sshd

  - type: wait_cloud_init
    timeout_secs: 600

  - type: create_file
    path: /etc/lithoSpore-gate
    content: |
      gate=lithoSpore-fedora-validation
      version=1.0.0
      purpose=rpm-portability-validation
      tier_max=2
      deployment_pattern=fedora-cloud
      selinux=enforcing
    mode: "0644"

post_boot_steps:
  - type: run_command
    command: mkdir -p /opt/lithoSpore && chmod 0755 /opt/lithoSpore && chown litho:litho /opt/lithoSpore
    timeout_secs: 30

validation_steps:
  - name: artifact_extract
    command: |
      mkdir -p /opt/lithoSpore
      tar xzf /tmp/lithoSpore-usb.tar.gz -C /opt/lithoSpore
    timeout_secs: 30
    description: Extract lithoSpore tarball

  - name: binary_check
    command: file /opt/lithoSpore/bin/litho
    expected_output_contains: "statically linked"
    timeout_secs: 5
    description: Verify litho is a static binary

  - name: selinux_status
    command: getenforce 2>/dev/null || echo "SELinux not available"
    expected_exit_code: 0
    timeout_secs: 5
    description: Check SELinux status

  - name: self_test
    command: /opt/lithoSpore/bin/litho self-test --artifact-root /opt/lithoSpore
    expected_exit_code: 0
    timeout_secs: 30
    description: Artifact integrity self-test

  - name: tier_detection
    command: /opt/lithoSpore/bin/litho tier --artifact-root /opt/lithoSpore
    expected_exit_code: 0
    timeout_secs: 10
    description: Tier detection on Fedora

  - name: full_validation
    command: /opt/lithoSpore/bin/litho validate --artifact-root /opt/lithoSpore --json
    expected_exit_code: 0
    timeout_secs: 120
    description: Full Tier 2 validation on Fedora

  - name: data_verify
    command: /opt/lithoSpore/bin/litho verify --artifact-root /opt/lithoSpore --json
    expected_exit_code: 0
    timeout_secs: 30
    description: Data integrity verification (BLAKE3 hashes)

  - name: deploy_report
    command: /opt/lithoSpore/bin/litho deploy-report --artifact-root /opt/lithoSpore --pattern fedora-cloud
    expected_exit_code: 0
    timeout_secs: 15
    description: Generate deployment report

verification:
  required_packages:
    - openssh-server

  required_services:
    - sshd

  required_files:
    - /etc/lithoSpore-gate

  verification_commands:
    - command: id litho
      expected_exit_code: 0
      description: User litho should exist

    - command: test -d /opt/lithoSpore
      expected_exit_code: 0
      description: lithoSpore mount point should exist

    - command: cat /etc/os-release | head -1
      expected_output_contains: Fedora
      description: Confirm Fedora OS

metadata:
  os: fedora
  os_version: "42"
  purpose: lithoSpore-rpm-portability
  fast_boot: true
  minimal: true
  project: ecoPrimals/CATHEDRAL
  deployment_pattern: fedora-cloud
  requires_libvirt: true
