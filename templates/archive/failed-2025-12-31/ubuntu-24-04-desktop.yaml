name: ubuntu-24-04-desktop
version: 1.0.0
base_image: /var/lib/libvirt/images/ubuntu-24.04-server-cloudimg-amd64.img
description: Ubuntu 24.04 LTS with desktop environment

resources:
  memory_mb: 4096
  vcpus: 2
  disk_gb: 30
  timeout_secs: 2400

build_steps:
  - type: wait_cloud_init
    timeout_secs: 600
  
  - type: install_packages
    packages:
      - ubuntu-desktop-minimal
      - gdm3
      - firefox
      - gnome-terminal

  - type: enable_service
    service: gdm3

  - type: run_command
    command: systemctl set-default graphical.target
    description: Set graphical boot target

verification:
  required_packages:
    - ubuntu-desktop-minimal
    - gdm3
    - gnome-shell
  
  required_services:
    - gdm3
  
  required_files:
    - /usr/bin/gnome-shell
    - /usr/sbin/gdm3
  
  verification_commands:
    - command: systemctl is-enabled gdm3
      expected_exit_code: 0
      description: GDM3 should be enabled

metadata:
  os: ubuntu
  os_version: "24.04"
  desktop: gnome

