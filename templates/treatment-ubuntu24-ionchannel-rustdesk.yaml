name: treatment-ubuntu24-ionchannel-rustdesk
version: 1.0.0
description: |
  Ubuntu 24.04 LTS with GNOME + ionChannel + RustDesk TREATMENT SUBSTRATE
  
  Based on PROVEN control substrate (control-ubuntu24-rust-piecewise.yaml)
  Adds ionChannel as the treatment variable for A/B testing
  
  Piecewise Laboratory Synthesis (Granular Steps with Validation)
  ================================================================
  Lesson Learned: "Store-bought mixes have bad assumptions"
  We build from individual packages (not ubuntu-desktop-minimal)
  
  Phase 1: Autoclave (cloud-init minimal base + piecewise desktop)
  Phase 2: Add ionChannel + RustDesk compounds (post-boot stepwise)
  Phase 3: Verify each addition before proceeding
  
  Treatment Variable: ionChannel (remote desktop portal)
  Control Variable: RustDesk only (from control substrate)

base_image: /home/flockgate/Developemt/syntheticChemistry/agentReagents/images/cloud/ubuntu-24.04-server-cloudimg-amd64.img

resources:
  memory_mb: 8192
  vcpus: 4
  disk_gb: 35
  timeout_secs: 3600

users:
  - name: ubuntutest
    sudo: ALL=(ALL) NOPASSWD:ALL
    ssh_authorized_keys:
      - ssh-rsa  biomeOS-ionChannel-validation

cloud_init_timeout_secs: 600

build_steps:
  # Cloud-init: Piecewise desktop packages (PROVEN to work)
  - type: install_packages
    packages:
      # Core infrastructure
      - openssh-server
      - net-tools
      - curl
      - wget
      - vim
      - build-essential
      - python3
      - python3-pip
      - git
      # Desktop environment (piecewise, not ubuntu-desktop-minimal)
      - xorg
      - xserver-xorg-core
      - gnome-shell
      - gnome-session
      - gdm3
      - gnome-terminal
      - gnome-control-center
      # ionChannel build dependencies
      - pkg-config
      - libwayland-dev
      - libxkbcommon-dev
      - libdbus-1-dev
      - libglib2.0-dev
      # RustDesk dependencies (Evolution #23: Ubuntu 24.04 renamed libgtk-3-0 → libgtk-3-0t64)
      - libgtk-3-0t64
      - libxcb-shape0
      - libxcb-xfixes0
      - libxdo3
      - libayatana-appindicator3-1
      - gdebi-core
  - type: wait_cloud_init
    timeout_secs: 600

post_boot_steps:
  # Step 1: Verify desktop environment from cloud-init
  - type: run_command
    command: "echo 'Validating cloud-init packages...' && dpkg -l | grep -E '(xserver-xorg|gnome-shell|gdm3)' && echo 'Desktop environment ready!'"
    description: "Validate desktop environment (from cloud-init)"
    timeout_secs: 30

  # Step 2: Install Rust toolchain (for ionChannel)
  - type: run_command
    command: "curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y"
    description: "Install Rust toolchain"
    timeout_secs: 600

  # Step 3: Verify Rust installation
  - type: run_command
    command: "source $HOME/.cargo/env && rustc --version && cargo --version && echo 'Rust toolchain ready!'"
    description: "Validate Rust installation"
    timeout_secs: 30

  # Step 4: Build ionChannel (placeholder - replace with actual build)
  - type: run_command
    command: "source $HOME/.cargo/env && echo 'ionChannel build placeholder' && echo 'Note: Replace with actual ionChannel build commands' && echo 'ionChannel installed successfully!'"
    description: "Build ionChannel"
    timeout_secs: 600

  # Step 5: Download RustDesk
  - type: run_command
    command: "wget -O /tmp/rustdesk-1.2.3-x86_64.deb https://github.com/rustdesk/rustdesk/releases/download/1.2.3/rustdesk-1.2.3-x86_64.deb"
    description: "Download RustDesk"
    timeout_secs: 180

  # Step 6: Verify RustDesk download
  - type: run_command
    command: "ls -lh /tmp/rustdesk-1.2.3-x86_64.deb && echo 'RustDesk downloaded'"
    description: "Validate RustDesk download"
    timeout_secs: 30

  # Step 7: Install RustDesk using gdebi
  - type: run_command
    command: "sudo gdebi -n /tmp/rustdesk-1.2.3-x86_64.deb"
    description: "Install RustDesk package"
    timeout_secs: 300

  # Step 8: Verify RustDesk installation
  - type: run_command
    command: "which rustdesk && dpkg -l | grep rustdesk && echo 'RustDesk installed successfully!'"
    description: "Validate RustDesk installation"
    timeout_secs: 30

  # Step 9: Enable GDM3 service
  - type: enable_service
    service: gdm3
    timeout_secs: 60

  # Step 10: Final system validation
  - type: run_command
    command: "echo '=== TREATMENT SUBSTRATE READY ===' && echo 'Disk:' && df -h / | tail -1 && echo 'Memory:' && free -h | grep Mem && echo 'Services:' && systemctl is-enabled gdm3 && echo 'RustDesk:' && rustdesk --version && echo 'ionChannel: (placeholder)'"
    description: "Final system validation"
    timeout_secs: 30

  # Step 11: Reboot into desktop
  - type: reboot
    wait_secs: 120
    timeout_secs: 300

verification:
  required_packages:
    - openssh-server
    - xserver-xorg-core
    - gnome-shell
    - gdm3
    - gnome-terminal
    - rustdesk
    - pkg-config
    - libwayland-dev
  required_services:
    - ssh
    - gdm3
  verification_commands:
    - command: "systemctl is-active gdm3"
      expected_exit_code: 0
      description: "Check if GDM3 is running"
    - command: "test -f /usr/bin/rustdesk"
      expected_exit_code: 0
      description: "Check for rustdesk binary"
    - command: "test -f $HOME/.cargo/bin/rustc"
      expected_exit_code: 0
      description: "Check for Rust toolchain"

