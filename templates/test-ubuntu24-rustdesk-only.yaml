name: test-ubuntu24-rustdesk-only
version: 3.0.0
description: |
  Ubuntu 24.04 LTS with GNOME + RustDesk (NO ionChannel)
  
  Simplified Test Substrate (Option 3)
  =====================================
  Removing ionChannel entirely to test if it's the culprit.
  This matches the control substrate more closely.
  
  Key Changes from Treatment:
  - NO ionChannel dependencies
  - NO Rust toolchain installation
  - NO build-essential, python3, git
  - ADDED explicit enable_service: gdm3 (like control)
  - Uses control's desktop package list

base_image: /home/flockgate/Developemt/syntheticChemistry/agentReagents/images/cloud/ubuntu-24.04-server-cloudimg-amd64.img

resources:
  memory_mb: 8192
  vcpus: 4
  disk_gb: 35
  timeout_secs: 3600

users:
  - name: rusttest
    sudo: ALL NOPASSWD:ALL
    ssh_authorized_keys:
      - ssh-rsa  biomeOS-ionChannel-validation

cloud_init_timeout_secs: 600

build_steps:
  # Match control substrate's package list EXACTLY
  - type: install_packages
    packages:
      # Core infrastructure
      - openssh-server
      - net-tools
      - curl
      - wget
      - vim
      # Desktop environment (matching control)
      - xorg
      - xserver-xorg-core
      - gnome-shell
      - gnome-session
      - gdm3
      - gnome-terminal
      - gnome-control-center
      # RustDesk dependencies (Evolution #23: Ubuntu 24.04 renamed libgtk-3-0 → libgtk-3-0t64)
      - libgtk-3-0t64
      - libxcb-shape0
      - libxcb-xfixes0
      - libxdo3
      - libayatana-appindicator3-1
      - gdebi-core
  - type: wait_cloud_init
    timeout_secs: 600

post_boot_steps:
  # Step 1: Validate desktop environment
  - type: run_command
    command: "echo 'Validating cloud-init packages...' && dpkg -l | grep -E '(xserver-xorg|gnome-shell|gdm3)' && echo 'Desktop environment ready!'"
    description: "Validate desktop environment (from cloud-init)"
    timeout_secs: 30

  # Step 2: Download RustDesk
  - type: run_command
    command: "wget -O /tmp/rustdesk-1.2.3-x86_64.deb https://github.com/rustdesk/rustdesk/releases/download/1.2.3/rustdesk-1.2.3-x86_64.deb"
    description: "Download RustDesk"
    timeout_secs: 180

  # Step 3: Verify download
  - type: run_command
    command: "ls -lh /tmp/rustdesk-1.2.3-x86_64.deb && echo 'RustDesk downloaded'"
    description: "Validate RustDesk download"
    timeout_secs: 30

  # Step 4: Install RustDesk using gdebi
  - type: run_command
    command: "sudo gdebi -n /tmp/rustdesk-1.2.3-x86_64.deb"
    description: "Install RustDesk package"
    timeout_secs: 300

  # Step 5: Verify RustDesk installation
  - type: run_command
    command: "which rustdesk && dpkg -l | grep rustdesk && echo 'RustDesk installed successfully!'"
    description: "Validate RustDesk installation"
    timeout_secs: 30

  # Step 6: CRITICAL - Enable GDM3 service (like control)
  - type: enable_service
    service: gdm3
    timeout_secs: 60

  # Step 7: Final system validation
  - type: run_command
    command: "echo '=== RUSTDESK-ONLY TEST SUBSTRATE ===' && echo 'Disk:' && df -h / | tail -1 && echo 'Memory:' && free -h | grep Mem && echo 'Services:' && systemctl is-enabled gdm3 && echo 'RustDesk:' && rustdesk --version"
    description: "Final system validation"
    timeout_secs: 30

  # Step 8: Reboot into desktop
  - type: reboot
    wait_secs: 120

verification:
  required_packages:
    - openssh-server
    - xserver-xorg-core
    - gnome-shell
    - gdm3
    - gnome-terminal
  required_services:
    - gdm3
  required_commands:
    - rustdesk

