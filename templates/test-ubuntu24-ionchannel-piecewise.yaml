name: test-ubuntu24-ionchannel-piecewise
version: 3.1.0
description: |
  Ubuntu 24.04 LTS with GNOME + ionChannel + RustDesk TEST SUBSTRATE
  
  Evolution #13: Deep Boot Diagnostics - Graphics Driver Fix
  ==========================================================
  Root cause identified: X.Org could not find /dev/dri/card0 or /dev/fb0
  after reboot, causing GDM3 to crash and network to fail.
  
  Solution: Explicitly install QEMU/KVM graphics drivers (QXL, fbdev, VESA)
  
  Evolution #14 (Future): Move driver selection to benchScale backend adapters
  for true substrate-agnostic deployments.
  
  Built using identical methodology to control:
  - Phase 1: Full desktop in cloud-init (proper GDM3 integration)
  - Phase 2: Application-specific setup via post-boot (ionChannel + RustDesk)
  - Phase 3: Validation at each step
  
  Expected Behavior:
  - Graphics drivers available for X.Org after reboot
  - GDM3 properly configured before first reboot
  - Network persists across reboots (DHCP)
  - ionChannel provides remote desktop portal
  - RustDesk works seamlessly through ionChannel

base_image: /home/flockgate/Developemt/syntheticChemistry/agentReagents/images/cloud/ubuntu-24.04-server-cloudimg-amd64.img

resources:
  memory_mb: 8192
  vcpus: 4
  disk_gb: 35
  timeout_secs: 3600
  # Evolution #10: Use DHCP for fractal scaling (no static_ip)

users:
  - name: iontest
    sudo: ALL NOPASSWD:ALL
    ssh_authorized_keys:
      - ssh-rsa  biomeOS-ionChannel-validation

cloud_init_timeout_secs: 1800  # 30 minutes for full desktop install

build_steps:
  # Evolution #11: Install FULL desktop in cloud-init for proper GDM3 integration
  # This ensures GDM3 and NetworkManager are configured during first boot,
  # preventing reboot failures caused by post-boot desktop installation.
  - type: install_packages
    packages:
      # Core infrastructure
      - openssh-server
      - net-tools
      - curl
      - wget
      - vim
      - build-essential
      - python3
      - python3-pip
      - git
      # Full desktop environment (CRITICAL: Must be in cloud-init)
      - ubuntu-desktop-minimal  # GNOME Shell + core desktop
      - gdm3                     # Display manager (critical for reboot)
      - gnome-terminal
      - gnome-shell-extensions
      # X11 components
      - xserver-xorg-core
      - xserver-xorg-input-all
      - xserver-xorg-video-all
      # Evolution #14: Explicit QEMU/KVM graphics drivers (will move to backend)
      - xserver-xorg-video-qxl      # QXL graphics for QEMU/KVM
      - xserver-xorg-video-fbdev     # Fallback framebuffer
      - xserver-xorg-video-vesa      # Legacy fallback
      - x11-xserver-utils
      - x11-utils
      - x11-common
      - x11-apps
      - xauth
      - xinit
  - type: wait_cloud_init
    timeout_secs: 1800  # 30 minutes for full desktop install

post_boot_steps:
  # Evolution #11: Desktop already installed in cloud-init
  # Post-boot only handles ionChannel + RustDesk specific setup
  
  # Step 1: Validate desktop environment
  - type: run_command
    command: "systemctl is-enabled gdm3 && test -f /usr/bin/gnome-shell  && echo 'Desktop environment ready'"
    description: "Validate desktop installed via cloud-init"
    timeout_secs: 30

  # Step 2: Install ionChannel dependencies
  - type: install_packages
    packages:
      - pkg-config
      - libwayland-dev
      - libxkbcommon-dev
      - libdbus-1-dev
      - libglib2.0-dev
    description: "Install ionChannel build dependencies"
    timeout_secs: 300

  # Step 3: Install Rust (for ionChannel)
  - type: run_command
    command: "curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y"
    description: "Install Rust toolchain"
    timeout_secs: 600

  # Step 4: Build ionChannel (placeholder)
  - type: run_command
    command: "source $HOME/.cargo/env && echo 'ionChannel build placeholder' && echo 'Would build ionChannel here'"
    description: "Build ionChannel"
    timeout_secs: 600

  # Step 5: Install RustDesk dependencies
  - type: install_packages
    packages:
      - libgtk-3-0t64t64
      - libxcb-shape0
      - libxcb-xfixes0
      - libxdo3
      - libayatana-appindicator3-1
    description: "Install RustDesk dependencies"
    timeout_secs: 300

  # Step 6: Download RustDesk
  - type: run_command
    command: "wget -O /tmp/rustdesk-1.2.3-x86_64.deb https://github.com/rustdesk/rustdesk/releases/download/1.2.3/rustdesk-1.2.3-x86_64.deb"
    description: "Download RustDesk"
    timeout_secs: 180

  # Step 7: Install RustDesk
  - type: run_command
    command: "sudo apt install -y /tmp/rustdesk-1.2.3-x86_64.deb"
    description: "Install RustDesk package"
    timeout_secs: 300

  # Step 8: Validate RustDesk
  - type: run_command
    command: "which rustdesk && dpkg -l | grep rustdesk && echo 'RustDesk installed'"
    description: "Validate RustDesk installation"
    timeout_secs: 30

  # Step 9: CRITICAL FIX - Enable GDM3 service explicitly (like control substrate)
  - type: enable_service
    service: gdm3
    timeout_secs: 60

  # Step 10: Final system check
  - type: run_command
    command: "echo 'Final check:' && df -h / | tail -1 && free -h | grep Mem && systemctl is-enabled gdm3 && echo 'ionChannel + RustDesk ready for A/B testing'"
    description: "Final system validation"
    timeout_secs: 30

  # Step 11: Reboot into fully configured desktop
  # Evolution #12: Added explicit enable_service for gdm3 (critical for reboot)
  - type: reboot
    wait_secs: 120

verification:
  # Post-reboot verification
  required_packages:
    - gnome-shell
    - gdm3
    - gnome-terminal
    - libgtk-3-0t64
    - libwayland-dev
  required_services:
    - gdm3
  required_commands:
    - rustdesk
