name: ubuntu24-rustdesk-v3
version: 1.0.0
description: |
  Ubuntu 24.04 LTS with GNOME + RustDesk (CONTROL SUBSTRATE)
  Expected behavior: RustDesk works correctly on GNOME/Wayland
  This is the baseline to show Ubuntu works without ionChannel
  
base_image: /home/flockgate/Developemt/syntheticChemistry/agentReagents/images/cloud/ubuntu-24.04-server-cloudimg-amd64.img

resources:
  memory_mb: 8192  # Increased from 4096 for GNOME desktop build
  vcpus: 4         # Increased from 2 for faster package installation
  disk_gb: 30
  timeout_secs: 3600

users:
  - name: ubuntutest
    password: ubuntu123
    groups:
      - sudo
      - users
    ssh_authorized_keys: []

build_steps:
  - type: wait_cloud_init
    timeout_secs: 600
  
  # Install GNOME desktop
  - type: install_packages
    packages:
      - ubuntu-desktop-minimal
      - gdm3
      - firefox
      - gnome-terminal
      - gnome-shell-extensions
      - net-tools
      - openssh-server
      - curl
      - wget
  
  # Configure GDM for auto-login
  - type: create_file
    path: /etc/gdm3/custom.conf
    content: |
      [daemon]
      AutomaticLoginEnable=true
      AutomaticLogin=ubuntutest
      WaylandEnable=true
    mode: "0644"
  
  - type: enable_service
    service: gdm3
  
  - type: enable_service
    service: ssh
  
  - type: run_command
    command: systemctl set-default graphical.target
    description: Set graphical boot target
  
  # Install RustDesk
  - type: run_command
    command: |
      apt-get install -y libxcb-randr0 libxcb-xtest0 libxcb-xfixes0 libxcb-shape0 libxcb-xkb1 libxcb-keysyms1 libxcb-cursor0
    description: Install RustDesk dependencies
  
  - type: download_file
    url: https://github.com/rustdesk/rustdesk/releases/download/1.2.3/rustdesk-1.2.3-x86_64.deb
    dest: /tmp/rustdesk.deb
  
  - type: run_command
    command: apt-get install -y /tmp/rustdesk.deb
    description: Install RustDesk from .deb package
  
  # Configure RustDesk for unattended access
  - type: create_file
    path: /home/ubuntutest/.config/rustdesk/RustDesk.toml
    content: |
      [options]
      password = "ubuntu123"
    mode: "0644"
  
  - type: run_command
    command: chown -R ubuntutest:ubuntutest /home/ubuntutest/.config/rustdesk
    description: Set RustDesk config ownership
  
  # Create marker file for validation
  - type: run_command
    command: |
      cat > /etc/ionchannel-substrate <<EOF
      substrate=control-ubuntu24-rustdesk
      version=1.0.0
      build_date=$(date -Iseconds)
      wayland=gnome
      rustdesk=installed
      expected_behavior=working
      control_type=baseline
      EOF
    description: Create substrate marker file

verification:
  required_packages:
    - ubuntu-desktop-minimal
    - gdm3
    - gnome-shell
  
  required_services:
    - gdm3
    - ssh
  
  required_files:
    - /usr/bin/gnome-shell
    - /usr/sbin/gdm3
    - /usr/bin/rustdesk
    - /etc/ionchannel-substrate
  
  verification_commands:
    - command: systemctl is-enabled gdm3
      expected_exit_code: 0
      description: GDM3 should be enabled
    
    - command: which rustdesk
      expected_exit_code: 0
      description: RustDesk should be installed
    
    - command: test -f /etc/ionchannel-substrate
      expected_exit_code: 0
      description: Substrate marker file should exist

metadata:
  purpose: ionchannel-ab-testing
  substrate_type: control-ubuntu24-rustdesk
  os: ubuntu
  os_version: "24.04"
  desktop: gnome
  wayland: true
  rustdesk: true
  control_type: baseline
  expected_behavior: working
  exportable: true

