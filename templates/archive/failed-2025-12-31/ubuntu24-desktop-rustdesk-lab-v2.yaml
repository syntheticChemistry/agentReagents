name: ubuntu24-desktop-rustdesk-control-lab
version: 2.0.0
description: |
  Ubuntu 24.04 + GNOME + RustDesk CONTROL SUBSTRATE
  
  Built using laboratory-grade stepwise synthesis:
  - Cloud-init: Minimal base (like autoclaving)
  - Post-boot: Desktop packages (heat-sensitive compounds added after cooling)
  
  This prevents the "Maillard reaction" (package conflicts) that occurs
  when trying to install desktop environments via cloud-init.

base_image: images/cloud/ubuntu-24.04-server-cloudimg-amd64.img

resources:
  memory_mb: 6144
  vcpus: 3
  disk_gb: 35
  timeout_secs: 3600  # 60 min total (cloud-init + post-boot)

users:
  - name: ubuntutest
    password: ubuntu123
    groups:
      - sudo
      - users
    ssh_authorized_keys: []

# Cloud-init: Keep MINIMAL (autoclaving phase)
build_steps:
  - type: install_packages
    packages:
      - openssh-server
      - curl
      - wget
      - vim
      - net-tools
      - build-essential

# Post-boot: Heavy lifting (add heat-sensitive compounds)
post_boot_steps:
  # Step 1: Update package lists
  - type: run_command
    command: sudo apt-get update
    description: "Update APT package lists"
    timeout_secs: 120

  # Step 2: Install GNOME desktop (the heat-sensitive compound)
  - type: install_packages
    packages:
      - ubuntu-desktop-minimal
      - gdm3
      - gnome-terminal
      - firefox
      - gnome-shell-extensions
    retry: true
    timeout_secs: 1800  # 30 min for desktop
    description: "Install GNOME desktop environment"

  # Step 3: Configure GDM3 for auto-login
  - type: create_file
    path: /etc/gdm3/custom.conf
    content: |
      [daemon]
      AutomaticLoginEnable=true
      AutomaticLogin=ubuntutest
      WaylandEnable=true
      [security]
      [xdmcp]
      [chooser]
      [debug]
    mode: "0644"
    
  # Step 4: Enable GDM3
  - type: enable_service
    service: gdm3
    start: false  # Will start on next boot

  # Step 5: Install RustDesk dependencies
  - type: install_packages
    packages:
      - libgtk-3-0
      - libxcb-shape0
      - libxcb-xfixes0
      - libxdo3
      - libayatana-appindicator3-1
    retry: true
    timeout_secs: 300
    description: "Install RustDesk dependencies"

  # Step 6: Download and install RustDesk
  - type: run_command
    command: |
      cd /tmp
      wget -q https://github.com/rustdesk/rustdesk/releases/download/1.2.3/rustdesk-1.2.3-x86_64.deb
      sudo dpkg -i rustdesk-1.2.3-x86_64.deb || sudo apt-get install -f -y
      rm rustdesk-1.2.3-x86_64.deb
    description: "Download and install RustDesk"
    timeout_secs: 600

  # Step 7: Configure RustDesk
  - type: run_command
    command: |
      mkdir -p /home/ubuntutest/.config/rustdesk
      cat > /home/ubuntutest/.config/rustdesk/RustDesk.toml <<'EOF'
      [options]
      direct-server = false
      relay-server = ""
      api-server = ""
      key = ""
      EOF
      chown -R ubuntutest:ubuntutest /home/ubuntutest/.config/rustdesk
    description: "Configure RustDesk"
    timeout_secs: 30

  # Step 8: Enable RustDesk autostart
  - type: run_command
    command: |
      mkdir -p /home/ubuntutest/.config/autostart
      cat > /home/ubuntutest/.config/autostart/rustdesk.desktop <<'EOF'
      [Desktop Entry]
      Type=Application
      Name=RustDesk
      Exec=/usr/bin/rustdesk
      Hidden=false
      NoDisplay=false
      X-GNOME-Autostart-enabled=true
      EOF
      chown -R ubuntutest:ubuntutest /home/ubuntutest/.config/autostart
    description: "Enable RustDesk autostart"
    timeout_secs: 30

  # Step 9: Create synthesis completion markers
  - type: create_file
    path: /root/SYNTHESIS_COMPLETE
    content: |
      Laboratory Stepwise Synthesis - COMPLETE
      ===========================================
      Date: $(date)
      Method: Post-boot stepwise addition
      
      Layers:
        1. Base (cloud-init): Minimal server
        2. Post-boot: GNOME desktop environment
        3. Post-boot: RustDesk application
      
      This is a CONTROL SUBSTRATE for ionChannel A/B testing.
      Expected: RustDesk works correctly on Ubuntu 24 GNOME/Wayland
    mode: "0644"

verification:
  required_packages:
    - openssh-server
    - curl
    - ubuntu-desktop-minimal
    - gdm3
    - gnome-terminal
    - firefox
    - rustdesk
  required_services:
    - ssh
    - gdm3
  required_files:
    - /root/SYNTHESIS_COMPLETE
    - /etc/gdm3/custom.conf
    - /usr/bin/rustdesk

