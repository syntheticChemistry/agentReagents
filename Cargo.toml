[package]
name = "agent-reagents"
version = "0.2.0"
edition = "2024"
authors = ["ecoPrimals <dev@ecoprimals.org>"]
description = "Template-driven VM image builder for the ecoPrimals ecosystem"
license = "AGPL-3.0-or-later"

[workspace]
# Standalone project — independently versioned within ecoPrimals/infra

[dependencies]
# Async runtime
tokio = { version = "1.35", features = ["full"] }

# Error handling
anyhow = "1.0"
thiserror = "2.0"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = { package = "yaml_serde", version = "0.10" }

# Hashing
sha2 = "0.10"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# Path handling
path-absolutize = "3.1"

# Date/time
chrono = { version = "0.4", features = ["serde"] }

# BenchScale must live at `../benchScale` (sibling checkout). Cargo does not allow `path` and
# `git` together on one dependency; clone both repos as in README "Build Requirements".
benchscale = { path = "../benchScale", features = ["libvirt"] }

# Libvirt bindings (for lab-cleanup tool)
virt = "0.3"

# Discovery: Use standard solutions (mDNS, DNS-SD, Consul)
# NOT creating custom substrate - primal philosophy is to use existing capabilities
# For service discovery, consumers should use:
# - mDNS/DNS-SD for local network discovery
# - Consul for distributed service discovery
# - Environment variables for explicit configuration

# CLI
clap = { version = "4.5", features = ["derive", "env"] }
dirs = "5.0"

[dev-dependencies]
tempfile = "3.8"

[lib]
name = "agent_reagents"
path = "src/lib.rs"

[[bin]]
name = "agent-reagents"
path = "src/bin/agent-reagents.rs"

[[bin]]
name = "lab-cleanup"
path = "src/bin/lab-cleanup.rs"

[[example]]
name = "build_cosmic_desktop"
path = "examples/build_cosmic_desktop.rs"

[[example]]
name = "list_images"
path = "examples/list_images.rs"

