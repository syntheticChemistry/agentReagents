name: reagent-nouveau-titanv
version: 2.0.0
description: |
  Disposable VM for capturing nouveau open-source driver init sequence on Titan V (GV100).
  GPU passed through via VFIO. mmiotrace captures full register write sequence.
  BAR0 snapshots at 3 points (cold, warm, post-unload) plus falcon state capture.
  Produces structured JSON recipe for sovereign Rust replayer.
  VM is destroyed after capture — driver never touches host kernel.

base_image: images/cloud/ubuntu-24.04-server-cloudimg-amd64.img

resources:
  memory_mb: 4096
  vcpus: 4
  disk_gb: 30
  timeout_secs: 900

pci_passthrough:
  - bdf: "0000:03:00.0"

users:
  - name: reagent
    password: reagent
    groups:
      - sudo
      - users

build_steps:
  - type: wait_cloud_init
    timeout_secs: 300

  - type: install_packages
    packages:
      - linux-headers-generic
      - build-essential
      - pciutils
      - trace-cmd
      - kmod
      - python3

  - type: create_file
    path: /opt/reagent/capture-mmiotrace.sh
    content: |
      #!/bin/bash
      set -euo pipefail

      ARTIFACTS=/opt/reagent/artifacts
      mkdir -p "$ARTIFACTS"

      GPU_BDF=$(lspci -d 10de:1d81 -D | head -1 | awk '{print $1}')
      if [ -z "$GPU_BDF" ]; then
        echo "ERROR: No Titan V (10de:1d81) found in VM"
        exit 1
      fi
      echo "Found Titan V at $GPU_BDF"

      BAR0=$(cat /sys/bus/pci/devices/$GPU_BDF/resource | head -1 | awk '{print $1}')
      echo "BAR0 physical address: $BAR0"

      echo "=== Phase 1: Cold BAR0 + falcon snapshot ==="
      python3 /opt/reagent/snapshot-bar0.py "$GPU_BDF" "$ARTIFACTS/cold_bar0.json"
      python3 /opt/reagent/snapshot-falcon.py "$GPU_BDF" "$ARTIFACTS/cold_falcon.json"

      echo "=== Phase 2: Enable mmiotrace ==="
      echo mmiotrace > /sys/kernel/debug/tracing/current_tracer
      echo 1 > /sys/kernel/debug/tracing/tracing_on
      echo "mmiotrace active"

      echo "=== Phase 3: Load nouveau (in-tree) ==="
      modprobe nouveau 2>&1 || true

      sleep 5
      echo "nouveau module loaded, waiting for init to settle..."
      sleep 10

      echo "=== Phase 4: Disable mmiotrace, capture trace ==="
      echo 0 > /sys/kernel/debug/tracing/tracing_on
      echo nop > /sys/kernel/debug/tracing/current_tracer
      cp /sys/kernel/debug/tracing/trace "$ARTIFACTS/mmiotrace.log"
      echo "mmiotrace captured: $(wc -l < $ARTIFACTS/mmiotrace.log) lines"

      echo "=== Phase 5: Warm BAR0 + falcon snapshot ==="
      python3 /opt/reagent/snapshot-bar0.py "$GPU_BDF" "$ARTIFACTS/warm_bar0.json"
      python3 /opt/reagent/snapshot-falcon.py "$GPU_BDF" "$ARTIFACTS/warm_falcon.json"

      echo "=== Phase 6: Unload nouveau ==="
      rmmod nouveau 2>/dev/null || true
      sleep 2

      echo "=== Phase 7: Post-unload BAR0 + falcon snapshot ==="
      python3 /opt/reagent/snapshot-bar0.py "$GPU_BDF" "$ARTIFACTS/post_unload_bar0.json"
      python3 /opt/reagent/snapshot-falcon.py "$GPU_BDF" "$ARTIFACTS/post_unload_falcon.json"

      echo "=== Phase 8: Generate staged recipe ==="
      python3 /opt/reagent/extract-recipe.py "$ARTIFACTS"

      echo "=== Capture complete ==="
      ls -la "$ARTIFACTS/"
      echo "Artifacts ready for extraction at $ARTIFACTS/"
    mode: "0755"

  - type: create_file
    path: /opt/reagent/snapshot-bar0.py
    content: |
      #!/usr/bin/env python3
      """Snapshot GPU BAR0 registers to JSON for diffing (GV100 / Titan V).

      Expanded register map covers all subsystems needed for sovereign replay:
      PMC, clocks, memory controller, PFIFO, falcons, GR, and display-less engine control.
      """
      import json, mmap, os, struct, sys, time

      REGISTER_REGIONS = {
          "PMC":           (0x000000, 0x001000),
          "PBUS":          (0x001000, 0x002000),
          "PFIFO":         (0x002000, 0x004000),
          "PTIMER":        (0x009000, 0x00A000),
          "PRI_MASTER":    (0x122000, 0x123000),
          "PRI_HUB":       (0x120000, 0x122000),
          "PTOP":          (0x020000, 0x024000),
          "PBDMA0":        (0x040000, 0x041000),
          "PBDMA1":        (0x041000, 0x042000),
          "PPCI":          (0x088000, 0x089000),
          "PFB":           (0x100000, 0x100800),
          "FBHUB":         (0x100800, 0x100C00),
          "PFB_NISO":      (0x100C00, 0x101000),
          "PCOPY":         (0x104000, 0x105000),
          "CLK":           (0x130000, 0x136000),
          "ROOT_PLL":      (0x136000, 0x137000),
          "PCLOCK":        (0x137000, 0x138000),
          "LTC":           (0x17E000, 0x180000),
          "PROM":          (0x300000, 0x301000),
          "PGRAPH":        (0x400000, 0x402000),
          "PGRAPH_PRI":    (0x404000, 0x410000),
          "FECS":          (0x409000, 0x40A000),
          "GPCCS":         (0x41A000, 0x41B000),
          "GPC0":          (0x500000, 0x508000),
          "PCCSR":         (0x800000, 0x802000),
          "USERMODE":      (0x810000, 0x811000),
          "SEC2":          (0x840000, 0x841000),
          "ACR":           (0x862000, 0x863000),
          "FBPA0":         (0x9A0000, 0x9A1000),
          "PMU":           (0x10A000, 0x10B000),
      }

      def snapshot(bdf, output_path):
          resource0 = f"/sys/bus/pci/devices/{bdf}/resource0"
          fd = os.open(resource0, os.O_RDWR | os.O_SYNC)
          size = os.path.getsize(resource0)
          mm = mmap.mmap(fd, min(size, 0x01000000), mmap.MAP_SHARED, mmap.PROT_READ)

          result = {"bdf": bdf, "timestamp": time.time(), "regions": {}}
          for name, (start, end) in sorted(REGISTER_REGIONS.items()):
              regs = {}
              for offset in range(start, min(end, len(mm)), 4):
                  try:
                      val = struct.unpack_from("<I", mm, offset)[0]
                      if val != 0 and val != 0xFFFFFFFF:
                          regs[f"0x{offset:06x}"] = f"0x{val:08x}"
                  except Exception:
                      pass
              result["regions"][name] = regs

          mm.close()
          os.close(fd)

          with open(output_path, 'w') as f:
              json.dump(result, f, indent=2)
          total = sum(len(v) for v in result['regions'].values())
          print(f"Snapshot: {total} non-zero registers -> {output_path}")

      if __name__ == "__main__":
          if len(sys.argv) != 3:
              print(f"Usage: {sys.argv[0]} <bdf> <output.json>")
              sys.exit(1)
          snapshot(sys.argv[1], sys.argv[2])
    mode: "0755"

  - type: create_file
    path: /opt/reagent/snapshot-falcon.py
    content: |
      #!/usr/bin/env python3
      """Snapshot falcon processor state for SEC2, FECS, GPCCS, PMU on GV100."""
      import json, mmap, os, struct, sys, time

      FALCONS = {
          "PMU":   0x10A000,
          "SEC2":  0x087000,
          "FECS":  0x409000,
          "GPCCS": 0x41A000,
      }

      FALCON_REGS = {
          "CPUCTL":     0x100,
          "BOOTVEC":    0x104,
          "SCTL":       0x240,
          "PC":         0x110,
          "MAILBOX0":   0x040,
          "MAILBOX1":   0x044,
          "HWCFG":      0x108,
          "IRQSTAT":    0x008,
          "IRQMODE":    0x00C,
          "EXCI":       0x0D8,
          "ITFEN":      0x048,
          "DMACTL":     0x10C,
      }

      def read_u32(mm, offset):
          try:
              return struct.unpack_from("<I", mm, offset)[0]
          except Exception:
              return 0xDEAD_DEAD

      def snapshot_falcons(bdf, output_path):
          resource0 = f"/sys/bus/pci/devices/{bdf}/resource0"
          fd = os.open(resource0, os.O_RDWR | os.O_SYNC)
          size = os.path.getsize(resource0)
          mm = mmap.mmap(fd, min(size, 0x01000000), mmap.MAP_SHARED, mmap.PROT_READ)

          result = {"bdf": bdf, "timestamp": time.time(), "falcons": {}}

          for falcon_name, base in FALCONS.items():
              regs = {}
              for reg_name, reg_off in FALCON_REGS.items():
                  addr = base + reg_off
                  if addr < len(mm):
                      val = read_u32(mm, addr)
                      regs[reg_name] = f"0x{val:08x}"
              result["falcons"][falcon_name] = {
                  "base": f"0x{base:06x}",
                  "registers": regs,
              }

          mm.close()
          os.close(fd)

          with open(output_path, 'w') as f:
              json.dump(result, f, indent=2)
          print(f"Falcon snapshot -> {output_path}")

      if __name__ == "__main__":
          if len(sys.argv) != 3:
              print(f"Usage: {sys.argv[0]} <bdf> <output.json>")
              sys.exit(1)
          snapshot_falcons(sys.argv[1], sys.argv[2])
    mode: "0755"

  - type: create_file
    path: /opt/reagent/extract-recipe.py
    content: |
      #!/usr/bin/env python3
      """Parse mmiotrace + BAR0 snapshots into a staged JSON recipe for sovereign replay.

      Classifies each mmiotrace write into an init stage based on register address,
      then emits a machine-readable recipe that the Rust replayer can consume.
      """
      import json, os, sys

      STAGES = [
          ("PMC_ENGINE_GATING",   [(0x000000, 0x001000), (0x001000, 0x002000)]),
          ("CLOCK_PLL",           [(0x130000, 0x138000), (0x136000, 0x137000)]),
          ("PRI_TOPOLOGY",        [(0x020000, 0x024000), (0x120000, 0x123000)]),
          ("PFB_MEMORY",          [(0x100000, 0x101000), (0x9A0000, 0x9B0000),
                                   (0x17E000, 0x190000)]),
          ("FALCON_BOOT",         [(0x087000, 0x088000), (0x10A000, 0x10C000),
                                   (0x409000, 0x40A000), (0x41A000, 0x41B000),
                                   (0x840000, 0x841000), (0x862000, 0x863000)]),
          ("GR_ENGINE_INIT",      [(0x400000, 0x500000)]),
          ("PFIFO_CHANNEL",       [(0x002000, 0x004000), (0x040000, 0x0A0000),
                                   (0x700000, 0x710000), (0x800000, 0x900000),
                                   (0x810000, 0x811000)]),
      ]

      def classify_stage(offset):
          for stage_name, ranges in STAGES:
              for start, end in ranges:
                  if start <= offset < end:
                      return stage_name
          return "OTHER"

      def parse_mmiotrace(path):
          writes = []
          bar0_base = None
          with open(path) as f:
              for line in f:
                  line = line.strip()
                  if not line or line.startswith('#'):
                      continue
                  parts = line.split()
                  if len(parts) >= 4 and parts[0] == "MAP" and bar0_base is None:
                      try:
                          bar0_base = int(parts[2], 16)
                      except ValueError:
                          pass
                      continue
                  if len(parts) < 6 or parts[0] != "W":
                      continue
                  try:
                      ts = float(parts[2])
                      addr = int(parts[4], 16)
                      val = int(parts[5], 16)
                      width = int(parts[1])
                  except (ValueError, IndexError):
                      continue
                  base = bar0_base or 0
                  offset = addr - base if addr >= base and base > 0 else addr
                  if offset > 0x01000000:
                      continue
                  writes.append({"ts": ts, "offset": offset, "value": val, "width": width})
          return writes

      def main(artifacts_dir):
          mmiotrace_path = os.path.join(artifacts_dir, "mmiotrace.log")
          if not os.path.exists(mmiotrace_path):
              print(f"No mmiotrace.log in {artifacts_dir}")
              sys.exit(1)

          writes = parse_mmiotrace(mmiotrace_path)
          print(f"Parsed {len(writes)} MMIO writes from mmiotrace")

          staged = {}
          for w in writes:
              stage = classify_stage(w["offset"])
              staged.setdefault(stage, []).append({
                  "offset": w["offset"],
                  "value": w["value"],
                  "width": w["width"],
              })

          recipe = {
              "gpu": "GV100",
              "driver": "nouveau",
              "total_writes": len(writes),
              "stages": {},
          }
          stage_order = [s[0] for s in STAGES] + ["OTHER"]
          for stage_name in stage_order:
              if stage_name in staged:
                  recipe["stages"][stage_name] = {
                      "count": len(staged[stage_name]),
                      "writes": staged[stage_name],
                  }

          output = os.path.join(artifacts_dir, "nouveau_recipe.json")
          with open(output, 'w') as f:
              json.dump(recipe, f, indent=2)
          print(f"\nStaged recipe -> {output}")
          for stage_name in stage_order:
              if stage_name in staged:
                  print(f"  {stage_name}: {len(staged[stage_name])} writes")

      if __name__ == "__main__":
          if len(sys.argv) != 2:
              print(f"Usage: {sys.argv[0]} <artifacts_dir>")
              sys.exit(1)
          main(sys.argv[1])
    mode: "0755"

verification:
  required_packages:
    - build-essential
    - pciutils
    - trace-cmd
  required_files:
    - /opt/reagent/capture-mmiotrace.sh
    - /opt/reagent/snapshot-bar0.py
    - /opt/reagent/snapshot-falcon.py
    - /opt/reagent/extract-recipe.py
  verification_commands:
    - command: "lspci -d 10de:1d81"
      expected_exit_code: 0
      description: "Titan V visible via PCI passthrough"

metadata:
  gpu: "Titan V (GV100)"
  driver: "nouveau (in-tree)"
  purpose: "reagent-capture-v2"
  disposable: "true"
