# SPDX-License-Identifier: AGPL-3.0-or-later
name: lithoSpore-debian-validation
version: 1.0.0
description: |
  Debian stable cloud VM for lithoSpore LTS portability testing.
  Debian 13 (Trixie) provides the stable LTS baseline — older kernel,
  conservative glibc, no snap/flatpak. Proves the musl-static binary
  works on the most conservative mainstream distribution.

  Deployment pattern: debian-lts (stable/institutional).

base_image: images/cloud/debian-13-generic-amd64.qcow2

resources:
  memory_mb: 2048
  vcpus: 2
  disk_gb: 20
  timeout_secs: 900

users:
  - name: litho
    groups:
      - sudo
      - users
    sudo: true
    shell: /bin/bash
    lock_passwd: false
    ssh_authorized_keys: []

build_steps:
  - type: install_packages
    packages:
      - openssh-server
      - qemu-guest-agent

  - type: enable_service
    service: ssh

  - type: wait_cloud_init
    timeout_secs: 600

  - type: create_file
    path: /etc/lithoSpore-gate
    content: |
      gate=lithoSpore-debian-validation
      version=1.0.0
      purpose=debian-lts-validation
      tier_max=2
      deployment_pattern=debian-lts
    mode: "0644"

post_boot_steps:
  - type: run_command
    command: mkdir -p /opt/lithoSpore && chmod 0755 /opt/lithoSpore && chown litho:litho /opt/lithoSpore
    timeout_secs: 30

validation_steps:
  - name: artifact_extract
    command: |
      mkdir -p /opt/lithoSpore
      tar xzf /tmp/lithoSpore-usb.tar.gz -C /opt/lithoSpore
    timeout_secs: 30
    description: Extract lithoSpore tarball

  - name: binary_check
    command: file /opt/lithoSpore/bin/litho
    expected_output_contains: "statically linked"
    timeout_secs: 5
    description: Verify litho is a static binary

  - name: self_test
    command: /opt/lithoSpore/bin/litho self-test --artifact-root /opt/lithoSpore
    expected_exit_code: 0
    timeout_secs: 30
    description: Artifact integrity self-test

  - name: tier_detection
    command: /opt/lithoSpore/bin/litho tier --artifact-root /opt/lithoSpore
    expected_exit_code: 0
    timeout_secs: 10
    description: Tier detection on Debian

  - name: full_validation
    command: /opt/lithoSpore/bin/litho validate --artifact-root /opt/lithoSpore --json
    expected_exit_code: 0
    timeout_secs: 120
    description: Full Tier 2 validation on Debian

  - name: data_verify
    command: /opt/lithoSpore/bin/litho verify --artifact-root /opt/lithoSpore --json
    expected_exit_code: 0
    timeout_secs: 30
    description: Data integrity verification (BLAKE3 hashes)

  - name: deploy_report
    command: /opt/lithoSpore/bin/litho deploy-report --artifact-root /opt/lithoSpore --pattern debian-lts
    expected_exit_code: 0
    timeout_secs: 15
    description: Generate deployment report

verification:
  required_packages:
    - openssh-server

  required_services:
    - ssh

  required_files:
    - /etc/lithoSpore-gate

  verification_commands:
    - command: id litho
      expected_exit_code: 0
      description: User litho should exist

    - command: test -d /opt/lithoSpore
      expected_exit_code: 0
      description: lithoSpore mount point should exist

    - command: cat /etc/os-release | head -1
      expected_output_contains: Debian
      description: Confirm Debian OS

metadata:
  os: debian
  os_version: "13"
  purpose: lithoSpore-debian-lts
  fast_boot: true
  minimal: true
  project: ecoPrimals/CATHEDRAL
  deployment_pattern: debian-lts
  requires_libvirt: true
