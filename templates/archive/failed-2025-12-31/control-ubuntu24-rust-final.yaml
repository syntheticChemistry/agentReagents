name: ctrl-ubuntu24-rust-final
version: 2.0.0
description: |
  Ubuntu 24.04 LTS with GNOME + RustDesk CONTROL SUBSTRATE
  
  Built using laboratory-grade stepwise synthesis:
  - Cloud-init: Minimal base (like autoclaving)
  - Post-boot: Desktop packages (heat-sensitive compounds added after cooling)
  
  This prevents the "Maillard reaction" (package conflicts) that occurs
  when trying to install desktop environments via cloud-init.

base_image: images/cloud/ubuntu-24.04-server-cloudimg-amd64.img

resources:
  memory_mb: 8192
  vcpus: 4
  disk_gb: 35
  timeout_secs: 3600 # Increased timeout for full build

users:
  - name: ubuntutest
    sudo: ALL NOPASSWD:ALL
    ssh_authorized_keys:
      - ssh-rsa CHANGEME_INSERT_YOUR_PUBLIC_KEY builder@gate

build_steps:
  # Cloud-init only for minimal setup
  - type: install_packages
    packages:
      - openssh-server
      - net-tools
      - curl
      - wget
      - vim
      - build-essential
      - python3
      - python3-pip
  - type: wait_cloud_init
    timeout_secs: 300 # Shorter timeout for minimal cloud-init

post_boot_steps:
  - type: run_command
    command: "sudo apt-get update"
    description: "Update APT package lists"
    timeout_secs: 120
  - type: install_packages
    packages:
      - ubuntu-desktop-minimal
      - gdm3
      - gnome-terminal
      - firefox
      - gnome-shell-extensions
      - libgtk-3-0
      - libxcb-shape0
      - libxcb-xfixes0
      - libxdo3
      - libayatana-appindicator3-1
    timeout_secs: 1800 # 30 minutes for desktop installation
  - type: enable_service
    service: gdm3
    timeout_secs: 60
  - type: run_command
    command: "wget -q https://github.com/rustdesk/rustdesk/releases/download/1.2.3/rustdesk-1.2.3-x86_64.deb -O /tmp/rustdesk.deb"
    description: "Download RustDesk .deb package"
    timeout_secs: 180
  - type: run_command
    command: "sudo apt install -y /tmp/rustdesk.deb"
    description: "Install RustDesk .deb package"
    timeout_secs: 300
  - type: run_command
    command: "sudo rm /tmp/rustdesk.deb"
    description: "Clean up RustDesk .deb package"
    timeout_secs: 60
  - type: enable_service
    service: rustdesk
    timeout_secs: 60
  - type: reboot
    wait_secs: 120
    timeout_secs: 300

verification:
  required_packages:
    - openssh-server
    - net-tools
    - curl
    - wget
    - vim
    - build-essential
    - python3
    - python3-pip
    - ubuntu-desktop-minimal
    - gdm3
    - gnome-terminal
    - firefox
    - gnome-shell-extensions
    - libgtk-3-0
    - libxcb-shape0
    - libxcb-xfixes0
    - libxdo3
    - libayatana-appindicator3-1
    - rustdesk
  required_services:
    - ssh
    - gdm3
    - rustdesk
  verification_commands:
    - command: "loginctl show-session $(loginctl | grep $(whoami) | awk '{print $1}') -p Type"
      expected_exit_code: 0
      description: "Check if desktop session type is wayland or x11"
    - command: "grep -q 'WaylandEnable=false' /etc/gdm3/custom.conf || true"
      expected_exit_code: 0
      description: "Check if Wayland is enabled in GDM3"
    - command: "test -f /usr/bin/gnome-shell"
      expected_exit_code: 0
      description: "Check for gnome-shell binary"
    - command: "test -f /usr/bin/gnome-control-center"
      expected_exit_code: 0
      description: "Check for gnome-control-center binary"
    - command: "test -f /usr/bin/firefox"
      expected_exit_code: 0
      description: "Check for firefox binary"
    - command: "test -f /usr/bin/rustdesk"
      expected_exit_code: 0
      description: "Check for rustdesk binary"

